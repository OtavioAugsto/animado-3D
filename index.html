<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aranha 3D — O Herói das Sombras</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: #05080c; overflow: hidden; }
      body { font-family: Helvetica, Arial, sans-serif; }

      @keyframes auraBreath { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.65; transform: scale(1.07); } }
      @keyframes xPulse { 0%, 100% { opacity: 0.25; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.15); } }
      @keyframes cloudDrift { 0% { transform: translateX(-2%); } 100% { transform: translateX(2%); } }
      @keyframes riseUp { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 0.8; } 100% { transform: translateY(-38vh); opacity: 0; } }
      @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }
      @keyframes floatSlow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

      .hero {
        width: 100vw; height: 100vh;
        background: #05080c;
        overflow: hidden; position: relative; cursor: default;
        /* acentos roxo-magenta do design (iguais nos dois estados) */
        --p-core: rgba(245,200,235,0.95);
        --p-mid: rgba(180,80,220,0.5);
        --light-color: rgba(200,120,255,0.12);
      }

      /* CAMADA 1: cidade full-bleed com parallax + crossfade noite/dia */
      .city, .city-day {
        position: absolute; inset: -2.5%;
        width: 105%; height: 105%;
        object-fit: cover;
        transform: translate(var(--bg-x, 0px), var(--bg-y, 0px));
        transition: transform 1s cubic-bezier(0.22, 1, 0.36, 1), opacity 4s ease;
        will-change: transform, opacity;
      }
      .city-day { opacity: 0; pointer-events: none; }
      .hero.is-day .city-day { opacity: 1; }

      .mist {
        /* mais larga que a tela: a borda nunca entra no quadro durante o drift de ±2% */
        position: absolute; top: 0; bottom: 0; left: -4%; right: -4%;
        background: linear-gradient(115deg, rgba(90,160,220,0.10) 0%, transparent 35%, transparent 65%, rgba(60,120,190,0.12) 100%);
        animation: cloudDrift 14s ease-in-out infinite alternate;
        pointer-events: none;
      }
      .mist-bottom {
        position: absolute; left: 0; right: 0; bottom: 0; height: 30%;
        background: linear-gradient(to top, rgba(8,20,34,0.55), transparent);
        pointer-events: none;
      }
      .cursor-light {
        position: absolute; inset: 0;
        background: radial-gradient(circle 420px at var(--light-x, 50%) var(--light-y, 40%), var(--light-color), transparent 70%);
        opacity: 0.35;
        transition: opacity 0.5s ease;
        pointer-events: none;
      }
      .hero.is-hover:not(.is-day) .cursor-light { opacity: 1; }

      /* luzes piscando nos prédios (apagam de dia) */
      .windows-layer { opacity: 1; transition: opacity 4s ease; }
      .hero.is-day .windows-layer { opacity: 0.3; }
      .window {
        position: absolute;
        border-radius: 1px;
        animation: twinkle var(--dur) ease-in-out infinite;
        animation-delay: var(--delay);
        mix-blend-mode: screen;
        pointer-events: none;
      }

      /* CAMADA 2: tipografia gigante (atrás do personagem) — crossfade de tinta */
      .title-block {
        position: absolute; left: 0; right: 0; top: 20%;
        display: flex; flex-direction: column; align-items: center; gap: 2vh;
        pointer-events: none; text-align: center;
      }
      /* título com tinta gradiente azul-aço (mesma nos dois estados, como no design) */
      .title-wrap h1 {
        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
        font-size: 15vw; line-height: 0.92;
        letter-spacing: 0.015em; text-transform: uppercase; white-space: nowrap;
        font-weight: normal;
        background: linear-gradient(180deg, #a9c9e4 0%, #6d92b5 55%, #46688a 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        text-shadow: 0 8px 50px rgba(0,0,0,0.7);
      }
      .title-block .rule {
        width: 88vw; height: 2px;
        background: linear-gradient(90deg, transparent, rgba(230,244,255,0.9), transparent);
      }
      .title-block .subtitle {
        color: rgba(160,195,225,0.95);
        font-size: 4.2vw; letter-spacing: 0.18em; text-transform: uppercase; white-space: nowrap;
        text-shadow: 0 3px 20px rgba(0,0,0,0.85);
        font-weight: 300;
      }

      /* CAMADA 3: personagem na frente do texto, com parallax próprio */
      .character {
        position: absolute; left: 50%; top: 53%;
        height: 88vh; aspect-ratio: 801 / 1090;
        transform: translate(-50%, -50%) translate(var(--ch-x, 0px), var(--ch-y, 0px));
        transition: transform 1s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: transform;
        pointer-events: none;
      }
      .character img {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 30px 60px rgba(0,0,0,0.55));
        transition: opacity 4s ease;
      }
      /* prateado assume de dia */
      .character img.variant-day { opacity: 0; }
      .hero.is-day .character img.variant-day { opacity: 1; }
      .hero.is-day .character img.variant-night { opacity: 0; }

      /* aura magenta-roxa respirando (design, nos dois estados) */
      .character .aura {
        position: absolute; left: 10%; top: 20%;
        width: 80%; height: 60%;
        background: radial-gradient(ellipse at center, rgba(190,60,120,0.3) 0%, rgba(120,40,180,0.12) 45%, transparent 70%);
        filter: blur(22px);
        animation: auraBreath 5.5s ease-in-out infinite;
        mix-blend-mode: screen;
      }

      /* pulso rosa do emblema X (design, nos dois estados) */
      .character .x-pulse {
        position: absolute; left: 39%; top: 49%;
        width: 23%; height: 15%;
        background: radial-gradient(ellipse at center, rgba(255,150,190,0.9) 0%, rgba(200,50,110,0.4) 45%, transparent 70%);
        filter: blur(11px);
        animation: xPulse 4s ease-in-out infinite;
        mix-blend-mode: screen;
      }

      /* teia trançada realista — sempre visível (as duas imagens vêm sem fio) */
      .character .web-svg { pointer-events: none; }

      /* partículas de energia (cor via variáveis por estado) */
      .particles {
        position: absolute; inset: 0;
        opacity: 0.55;
        transition: opacity 0.6s ease;
        pointer-events: none;
      }
      .hero.is-hover .particles { opacity: 1; }
      .particle {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, var(--p-core) 0%, var(--p-mid) 55%, transparent 75%);
        animation: riseUp var(--dur) linear infinite;
        animation-delay: var(--delay);
        opacity: 0;
        will-change: transform, opacity;
      }

      /* rodapé */
      .footer {
        position: absolute; left: 0; right: 0; bottom: 4.5%;
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        pointer-events: none; text-align: center;
      }
      .footer .em-breve {
        color: rgba(225,240,252,0.9);
        font-size: clamp(11px, 1vw, 16px);
        letter-spacing: 0.45em; text-transform: uppercase;
        text-shadow: 0 2px 12px rgba(0,0,0,0.85);
      }
      .footer .tagline {
        color: rgba(185,208,228,0.85);
        font-size: clamp(13px, 1.2vw, 20px);
        letter-spacing: 0.04em;
        text-shadow: 0 2px 12px rgba(0,0,0,0.85);
      }
    </style>
  </head>
  <body>
    <section class="hero is-day" id="hero">
      <img class="city" src="/assets/city-bg.jpg" alt="" />
      <img class="city-day" src="/assets/city-bg-day.jpg" alt="" aria-hidden="true" />
      <div class="mist"></div>
      <div class="mist-bottom"></div>
      <div class="cursor-light"></div>

      <div class="windows-layer" id="windows"></div>

      <div class="title-block">
        <div class="title-wrap">
          <h1>Aranha 3D</h1>
        </div>
        <div class="rule"></div>
        <div class="subtitle">O herói das sombras</div>
      </div>

      <div class="character">
        <!-- teia realista trançada (design) — sai da mão esquerda -->
        <svg class="web-svg" viewBox="0 0 140 164.3" preserveAspectRatio="none"
             style="position: absolute; left: -120%; top: -102.5%; width: 140%; height: 120.8%; overflow: visible;"
             aria-hidden="true">
          <defs>
            <linearGradient id="webStrand" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="rgba(240,246,252,0.06)" />
              <stop offset="0.45" stop-color="rgba(236,243,250,0.75)" />
              <stop offset="1" stop-color="rgba(255,255,255,0.98)" />
            </linearGradient>
          </defs>

          <path d="M -0.00 0.00 L2.60 2.51 L5.00 5.19 L7.15 8.09 L9.18 11.08 L11.33 13.98 L13.74 16.66 L16.34 19.16 L18.94 21.68 L21.33 24.36 L23.47 27.26 L25.51 30.26 L27.66 33.15 L30.07 35.82 L32.68 38.33 L35.28 40.84 L37.66 43.53 L39.80 46.44 L41.84 49.43 L44.00 52.32 L46.41 54.99 L49.02 57.49 L51.61 60.01 L54.00 62.70 L56.13 65.61 L58.17 68.60 L60.33 71.48 L62.75 74.15 L65.36 76.65 L67.95 79.17 L70.33 81.87 L72.46 84.78 L74.49 87.77 L76.66 90.65 L79.08 93.32 L81.70 95.82 L84.29 98.34 L86.66 101.04 L88.79 103.95 L90.82 106.95 L92.99 109.82 L95.42 112.48 L98.03 114.98 L100.62 117.50 L102.99 120.21 L105.11 123.13 L107.15 126.12 L109.33 128.99 L111.76 131.65 L114.37 134.14 L116.96 136.67 L119.32 139.38 L121.44 142.30 L123.48 145.29 L125.69 148.14 L128.14 150.77 L130.70 153.32 L133.16 155.94 L135.47 158.70 L137.70 161.53 L139.96 164.33" fill="none" stroke="url(#webStrand)" stroke-linecap="round" vector-effect="non-scaling-stroke" style="stroke-width: 1.3px" />
          <path d="M4.33 5.76 L5.00 5.19 M14.26 16.20 L13.74 16.66 M23.19 27.50 L23.47 27.26 M32.66 38.35 L32.68 38.33 M42.16 49.15 L41.84 49.43 M51.05 60.48 L51.61 60.01 M61.00 70.91 L60.33 71.48 M69.67 82.43 L70.33 81.87 M79.58 92.89 L79.08 93.32 M88.55 104.16 L88.79 103.95 M97.97 115.04 L98.03 114.98 M107.52 125.81 L107.15 126.12 M116.38 137.17 L116.96 136.67 M126.31 147.60 L125.69 148.14 M135.19 158.94 L135.47 158.70" fill="none" stroke="rgba(225,236,246,0.55)" vector-effect="non-scaling-stroke" style="stroke-width: 0.8px" />
        </svg>
        <div class="aura"></div>
        <img class="variant-night" src="/assets/aranha-character-preto2.webp" alt="Aranha 3D" />
        <img class="variant-day" src="/assets/aranha-character-prateado2.webp" alt="" aria-hidden="true" />
        <div class="x-pulse"></div>
      </div>

      <div class="particles" id="particles"></div>

      <div class="footer">
        <div class="em-breve">Em breve</div>
        <div class="tagline">Com grandes poderes vêm grandes responsabilidades</div>
      </div>
    </section>

    <script>
      const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

      const PARTICLE_COUNT = 22;
      const PARALLAX_DEPTH = 14; // px
      const DAY_ON_HOVER = true;

      const particlesEl = document.getElementById("particles");
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.style.left = (34 + seed(i) * 32) + "%";
        p.style.bottom = (8 + seed(i + 50) * 44) + "%";
        const size = 2 + seed(i + 100) * 3.5;
        p.style.width = size + "px";
        p.style.height = size + "px";
        p.style.setProperty("--dur", (7 + seed(i + 200) * 6) + "s");
        p.style.setProperty("--delay", (seed(i + 250) * 8) + "s");
        particlesEl.appendChild(p);
      }

      const windowsEl = document.getElementById("windows");
      const colors = ["rgba(140,210,255,0.9)", "rgba(255,230,170,0.8)", "rgba(120,235,255,0.85)"];
      for (let i = 0; i < 26; i++) {
        const w = document.createElement("div");
        w.className = "window";
        w.style.left = (seed(i + 300) * 92 + 3) + "%";
        w.style.top = (42 + seed(i + 350) * 53) + "%";
        const size = 2 + Math.round(seed(i + 400) * 2);
        w.style.width = size + "px";
        w.style.height = size + "px";
        w.style.background = colors[i % 3];
        w.style.setProperty("--dur", (2.5 + seed(i + 450) * 4) + "s");
        w.style.setProperty("--delay", (seed(i + 500) * 5) + "s");
        windowsEl.appendChild(w);
      }

      // parallax duplo (cidade × personagem) + luz do cursor + dia/noite no hover
      const hero = document.getElementById("hero");
      hero.addEventListener("mousemove", (e) => {
        const r = hero.getBoundingClientRect();
        const nx = (e.clientX - r.left) / r.width;
        const ny = (e.clientY - r.top) / r.height;
        const mx = nx * 2 - 1, my = ny * 2 - 1;
        hero.style.setProperty("--bg-x", (-mx * PARALLAX_DEPTH) + "px");
        hero.style.setProperty("--bg-y", (-my * PARALLAX_DEPTH * 0.6) + "px");
        hero.style.setProperty("--ch-x", (mx * PARALLAX_DEPTH * 0.9) + "px");
        hero.style.setProperty("--ch-y", (my * PARALLAX_DEPTH * 0.5) + "px");
        hero.style.setProperty("--light-x", (nx * 100) + "%");
        hero.style.setProperty("--light-y", (ny * 100) + "%");
      });
      // ordem invertida: dia é o padrão; a noite chega no hover
      hero.addEventListener("mouseenter", () => {
        hero.classList.add("is-hover");
        if (DAY_ON_HOVER) hero.classList.remove("is-day");
      });
      hero.addEventListener("mouseleave", () => {
        hero.classList.remove("is-hover");
        hero.classList.add("is-day");
        hero.style.setProperty("--bg-x", "0px");
        hero.style.setProperty("--bg-y", "0px");
        hero.style.setProperty("--ch-x", "0px");
        hero.style.setProperty("--ch-y", "0px");
      });
    </script>
  </body>
</html>
